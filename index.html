<style>
*{

}

body{

/* CONTENEUR PRINCIPAL */
.card{
  width:100%;

  background:#f0f2f5;
  padding:0;

/* TITRES */

}

h1{

}

h2{

}

/* SOUS-TITRE */
.subtitle{
  text-align:center;
  color:#65676b;
  margin-bottom:15px;
}

/* CHAMPS */
input,textarea{
  width:100%;
  padding:13px;
  margin:7px 0;
  border:1px solid #ccd0d5;
  border-radius:8px;
  font-size:16px;
  outline:none;
  background:white;
  color:#050505;
}

input:focus,
textarea:focus{
  border-color:#1877f2;
}

textarea{
  min-height:100px;
  resize:vertical;
}

/* BOUTONS */
button{
  width:100%;
  padding:12px;
  margin:5px 0;
  border:0;
  border-radius:8px;
  font-size:16px;
  font-weight:bold;

.action{

/* MENU */
.nav-grid{
  display:grid;
  grid-template-columns:1fr 1fr;

/* ÉLÉMENTS CACHÉS */

.mode{

/* PROFIL UTILISATEUR */

/* MESSAGES */
.messages-list{

/* NOTIFICATIONS */

/* PARAMÈTRES */

  }

  }

    grid-template-columns:1fr 1fr;
  }

}

===================================================== */

async function inscription(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const message =
document.getElementById("authMessage");


if(!email || !password){

message.textContent =
"⚠️ Entre ton e-mail et ton mot de passe.";

return;
}


if(password.length < 6){

message.textContent =

}


message.textContent =
"Création du compte...";

await supabaseClient.auth.signUp({
email:email,
password:password
});

message.textContent =

return;
}

await createProfile();

openApp();

}else{

===================================================== */

async function connexion(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const message =
document.getElementById("authMessage");


if(!email || !password){

message.textContent =
"⚠️ Entre ton e-mail et ton mot de passe.";

}


message.textContent =
"Connexion...";

});

document

}

async function loadProfile(){

if(!currentUser) return;

document.getElementById("profileEmail").value =
currentUser.email || "";

const {data,error} =
await supabaseClient
.from("PROFILS")
.select("Username,Full_name,Bio")
.eq("id",currentUser.id)
.maybeSingle();

if(error){

document.getElementById("profileMessage").textContent =
"❌ " + error.message;

return;
}

if(data){

document.getElementById("profileUsername").value =
data.Username || "";

document.getElementById("profileFullName").value =
data.Full_name || "";

data.Bio || "";

}

}


/* =====================================================

===================================================== */

async function saveProfile(){

if(!currentUser) return;

const username =
document.getElementById("profileUsername").value.trim();

const fullName =
document.getElementById("profileFullName").value.trim();

const bio =
document.getElementById("profileBio").value.trim();

if(!search){

results.innerHTML =
"⚠️ Entre un pseudo à rechercher.";

return;
}

results.innerHTML =
"🔎 Recherche...";

const {data,error} =
await supabaseClient
.from("PROFILS")
.select("id,Username,Full_name")
.ilike("Username","%" + search + "%");

if(error){

results.innerHTML =
"❌ " + error.message;

return;
}

if(!data || data.length === 0){

results.innerHTML =
"😔 Aucun utilisateur trouvé.";

return;
}

results.innerHTML = "";

data.forEach(user => {

if(user.id === currentUser.id) return;

const div =
document.createElement("div");

div.className = "result-user";

div.innerHTML = `
<strong>👤 ${user.Username || "Sans pseudo"}</strong>
<br>
<span>${user.Full_name || ""}</span>
`;

div.onclick = function(){

openUserProfile(user.id);

};

results.appendChild(div);

});

}


/* =====================================================
   OUVRIR PROFIL UTILISATEUR
===================================================== */

async function openUserProfile(userId){

selectedUserId = userId;

showPage("userProfilePage");

const content =
document.getElementById("userProfileContent");

content.innerHTML =
"🔎 Chargement du profil...";

const {data,error} =
await supabaseClient
.from("PROFILS")
.select("Username,Full_name,Bio")
.eq("id",userId)
.maybeSingle();

if(error){

content.innerHTML =
"❌ " + error.message;

return;
}

if(!data){

content.innerHTML =
"❌ Profil introuvable.";

return;
}

content.innerHTML = `
<h2>👤 ${data.Username || "Utilisateur"}</h2>

<p><strong>Nom :</strong><br>
${data.Full_name || "Non renseigné"}</p>

<p><strong>Présentation :</strong><br>
${data.Bio || "Aucune présentation."}</p>
`;

}


/* =====================================================
   MESSAGE DEPUIS PROFIL
===================================================== */

function startConversationFromProfile(){

    if(!selectedUserId){

        alert("Utilisateur introuvable.");

        return;
    }

    selectedConversationUserId =
    selectedUserId;

    showPage("messagesPage");

    const chatArea =
    document.getElementById("chatArea");

    chatArea.classList.remove("hidden");

    loadMessages();

}

















/* =====================================================
   MESSAGES
===================================================== */

async function loadMessages(){

    const conversations =
    document.getElementById("conversations");

    if(!currentUser){
        conversations.innerHTML =
        "❌ Tu dois être connecté.";
        return;
    }

    if(!selectedConversationUserId){
        conversations.innerHTML =
        "💬 Choisis une conversation.";
        return;
    }

    const { data, error } = await supabaseClient
    .from("MESSAGES")
    .select("sender_id,receiver_id,content")
    .or(
        `and(sender_id.eq.${currentUser.id},receiver_id.eq.${selectedConversationUserId}),and(sender_id.eq.${selectedConversationUserId},receiver_id.eq.${currentUser.id})`
    )
    .order("created_at", { ascending: true });

    if(error){
        conversations.innerHTML =
        "❌ Erreur : " + error.message;
        return;
    }

    if(!data || data.length === 0){
        conversations.innerHTML =
        "💬 Aucun message pour le moment.";
        return;
    }

    conversations.innerHTML = "";

    data.forEach(message => {

        const div = document.createElement("div");

        div.className = "message-box";

        if(message.sender_id === currentUser.id){
            div.innerHTML =
            "🧑 <strong>Moi :</strong> " +
            message.content;
        }else{
            div.innerHTML =
            "👤 <strong>Lui :</strong> " +
            message.content;
        }

        conversations.appendChild(div);

    });

}










/* =====================================================
   ENVOYER MESSAGE
===================================================== */

async function sendMessage(){

if(!selectedConversationUserId){

alert("Choisis d'abord une conversation.");

return;
}

const input =
document.getElementById("messageInput");

const text =
input.value.trim();

if(!text) return;

if(!currentUser){

alert("Tu dois être connecté.");

return;
}

const { data, error } =
await supabaseClient
.from("MESSAGES")
.insert({
sender_id: currentUser.id,
receiver_id: selectedConversationUserId,
content: text
})
.select()
.single();

if(error){

alert("Erreur : " + error.message);

return;
}

input.value = "";

await loadMessages();

}

===================================================== */

async function deconnexion(){

await supabaseClient.auth.signOut();

currentUser = null;

document.getElementById("app")
.classList.add("hidden");

document.getElementById("auth")
.classList.remove("hidden");

document.getElementById("email").value = "";
document.getElementById("password").value = "";

document.getElementById("authMessage").textContent =
"";

showPage("homePage");

}

   SESSION EXISTANTE
===================================================== */

async function checkSession(){

const {data} =
await supabaseClient.auth.getSession();

if(data.session){

currentUser =
data.session.user;

openApp();

}

}


/* =====================================================
   LANCEMENT
===================================================== */

checkSession();
