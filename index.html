let names=[],turn=0,usedTruth=[],usedAction=[];

function startGame(){
  const a=document.getElementById('p1').value.trim()||"Joueur 1";
  const b=document.getElementById('p2').value.trim()||"Joueur 2";
  names=[a,b];turn=0;
  document.getElementById('home').style.display='none';
  document.getElementById('game').style.display='block';
  updateTurn();
}
function updateTurn(){
  document.getElementById('turn').textContent="💗 Tour de "+names[turn];
  document.getElementById('mode').textContent="Choisis Action ou Vérité";
  document.getElementById('question').textContent="À toi de choisir 😍";
}
function randomUnused(arr,used){
  if(used.length>=arr.length) used.length=0;
  let i;
  do{i=Math.floor(Math.random()*arr.length)}while(used.includes(i)&&used.length<arr.length);
  used.push(i);return arr[i];
}
function showQuestion(type){
  const q=type==="truth"?randomUnused(truths,usedTruth):randomUnused(actions,usedAction);
  document.getElementById('mode').textContent=type==="truth"?"💜 VÉRITÉ":"🔥 ACTION";
  document.getElementById('question').textContent=q;
}
function nextTurn(){
  turn=(turn+1)%2;updateTurn();
}
function resetGame(){
  document.getElementById('game').style.display='none';
  document.getElementById('home').style.display='block';
  usedTruth=[];usedAction=[];
}
