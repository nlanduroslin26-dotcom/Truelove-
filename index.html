<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Connect - Réseau social</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f0f2f5;
    color:#1c1e21;
}

header{
    height:60px;
    background:white;
    display:flex;
    align-items:center;
    padding:0 20px;
    gap:20px;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 1px 3px #0002;
}

.logo{
    color:#1877f2;
    font-size:30px;
    font-weight:bold;
}

.search{
    background:#f0f2f5;
    border:none;
    border-radius:25px;
    padding:12px 18px;
    width:280px;
    outline:none;
}

nav{
    display:flex;
    gap:10px;
    margin:auto;
}

nav button{
    border:none;
    background:white;
    font-size:23px;
    padding:10px 25px;
    cursor:pointer;
    border-radius:8px;
}

nav button:hover{
    background:#f0f2f5;
}

.container{
    max-width:1200px;
    margin:20px auto;
    display:grid;
    grid-template-columns:240px 1fr 260px;
    gap:20px;
}

.card{
    background:white;
    border-radius:10px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 1px 2px #0002;
}

.profile{
    display:flex;
    align-items:center;
    gap:10px;
}

.avatar{
    width:45px;
    height:45px;
    border-radius:50%;
    object-fit:cover;
}

.menu{
    display:block;
    width:100%;
    text-align:left;
    padding:13px;
    border:none;
    background:white;
    cursor:pointer;
    border-radius:8px;
    font-size:16px;
}

.menu:hover{
    background:#f0f2f5;
}

.composer{
    display:flex;
    gap:10px;
}

.composer input{
    flex:1;
    border:none;
    background:#f0f2f5;
    border-radius:25px;
    padding:13px;
    outline:none;
}

.actions{
    display:flex;
    margin-top:15px;
    border-top:1px solid #ddd;
    padding-top:10px;
}

.actions button{
    flex:1;
    border:none;
    background:white;
    padding:10px;
    cursor:pointer;
    border-radius:7px;
}

.actions button:hover{
    background:#f0f2f5;
}

.post-header{
    display:flex;
    align-items:center;
    gap:10px;
}

.post-header div{
    flex:1;
}

.post-content{
    margin:15px 0;
    white-space:pre-wrap;
}

.post-buttons{
    display:flex;
    border-top:1px solid #ddd;
    padding-top:8px;
}

.post-buttons button{
    flex:1;
    border:none;
    background:white;
    padding:10px;
    cursor:pointer;
    font-weight:bold;
}

.post-buttons button:hover{
    background:#f0f2f5;
}

.comment{
    background:#f0f2f5;
    padding:8px;
    border-radius:15px;
    margin-top:7px;
}

button.primary{
    background:#1877f2;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

button.danger{
    background:#ffebe9;
    color:#d00;
    border:none;
    padding:9px;
    border-radius:7px;
    cursor:pointer;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:#0008;
    z-index:500;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-box{
    background:white;
    padding:20px;
    border-radius:12px;
    width:100%;
    max-width:500px;
}

.modal textarea{
    width:100%;
    min-height:130px;
    padding:12px;
    margin:15px 0;
    border:1px solid #ddd;
    border-radius:8px;
}

.close{
    float:right;
    border:none;
    background:#eee;
    border-radius:50%;
    width:30px;
    height:30px;
    cursor:pointer;
}

.user{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px;
}

.user button{
    margin-left:auto;
}

.message{
    padding:12px;
    border-bottom:1px solid #eee;
    cursor:pointer;
}

.message:hover{
    background:#f0f2f5;
}

.notification{
    padding:15px;
    border-bottom:1px solid #eee;
}

.hidden{
    display:none;
}

@media(max-width:900px){

.container{
    grid-template-columns:70px 1fr;
}

.right{
    display:none;
}

.menu span{
    display:none;
}

}

@media(max-width:600px){

header{
    padding:0 8px;
}

.logo{
    font-size:23px;
}

.search{
    display:none;
}

nav button{
    padding:8px;
}

.container{
    display:block;
    margin:5px;
}

.left{
    display:none;
}

.card{
    border-radius:7px;
}

}

</style>
</head>

<body>

<header>

<div class="logo">
Connect
</div>

<input
class="search"
id="search"
placeholder="Rechercher sur Connect"
>

<nav>

<button onclick="showHome()">🏠</button>

<button onclick="showFriends()">👥</button>

<button onclick="showMessages()">💬</button>

<button onclick="showNotifications()">🔔</button>

</nav>

<button onclick="logout()">Déconnexion</button>

</header>

<div class="container">

<aside class="left">

<div class="card">

<div class="profile">

<img
id="myAvatar"
class="avatar"
src="https://i.pravatar.cc/100"
>

<div>

<b id="myName">
Utilisateur
</b>

</div>

</div>

<hr style="margin:12px 0">

<button class="menu" onclick="showHome()">
🏠 <span>Accueil</span>
</button>

<button class="menu" onclick="showFriends()">
👥 <span>Amis</span>
</button>

<button class="menu" onclick="showMessages()">
💬 <span>Messages</span>
</button>

<button class="menu" onclick="showNotifications()">
🔔 <span>Notifications</span>
</button>

<button class="menu" onclick="showProfile()">
👤 <span>Profil</span>
</button>

</div>

</aside>

<main id="app">

</main>

<aside class="right">

<div class="card">

<h3>Contacts</h3>

<div id="contacts">
Chargement...
</div>

</div>

<div class="card">

<h3>Suggestions</h3>

<div id="suggestions">
Chargement...
</div>

</div>

</aside>

</div>

<div id="modal" class="modal">

<div class="modal-box" id="modalBox">

</div>

</div>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"TON_SUPABASE_URL";

const SUPABASE_ANON_KEY =
"TON_SUPABASE_ANON_KEY";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


/* =====================================================
   UTILITAIRES
===================================================== */

let currentUser = null;

function escapeHTML(text){

    return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =====================================================
   AUTHENTIFICATION
===================================================== */

async function register(){

    const email =
        prompt("Votre adresse e-mail :");

    const password =
        prompt("Votre mot de passe :");

    const username =
        prompt("Votre nom d'utilisateur :");

    const fullName =
        prompt("Votre nom complet :");

    if(!email || !password || !username || !fullName)
        return;

    const {data,error} =
        await supabaseClient.auth.signUp({

            email:email,

            password:password,

            options:{
                data:{
                    username:username,
                    full_name:fullName
                }
            }

        });

    if(error){

        alert(error.message);
        return;

    }

    alert(
        "Compte créé. Vérifiez votre adresse e-mail si Supabase le demande."
    );

}


async function login(){

    const email =
        prompt("Adresse e-mail :");

    const password =
        prompt("Mot de passe :");

    if(!email || !password)
        return;

    const {data,error} =
        await supabaseClient.auth.signInWithPassword({

            email:email,

            password:password

        });

    if(error){

        alert(error.message);
        return;

    }

    currentUser =
        data.user;

    await loadProfile();

    showHome();

}


async function logout(){

    await supabaseClient.auth.signOut();

    location.reload();

}


/* =====================================================
   PROFIL
===================================================== */

async function loadProfile(){

    if(!currentUser)
        return;

    const {data,error} =
        await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id",currentUser.id)
        .single();

    if(error){

        console.log(error);
        return;

    }

    document.getElementById("myName")
        .textContent = data.full_name;

    document.getElementById("myAvatar")
        .src =
        data.avatar_url ||
        "https://i.pravatar.cc/100";

}


/* =====================================================
   ACCUEIL
===================================================== */

async function showHome(){

    if(!currentUser){

        showLogin();
        return;

    }

    const app =
        document.getElementById("app");

    app.innerHTML = `

    <div class="card">

        <div class="composer">

            <img
                class="avatar"
                src="${document.getElementById("myAvatar").src}"
            >

            <input
                id="postInput"
                placeholder="À quoi pensez-vous ?"
                onkeydown="if(event.key==='Enter')createPost()"
            >

        </div>

        <div class="actions">

            <button onclick="createPost()">
                📝 Publication
            </button>

            <button onclick="alert('Ajoutez ici votre système de photos Supabase Storage.')">
                📷 Photo
            </button>

            <button>
                😊 Humeur
            </button>

        </div>

    </div>

    <div id="posts">
        Chargement...
    </div>
    `;

    await loadPosts();

    loadContacts();

}


async function createPost(){

    const input =
        document.getElementById("postInput");

    if(!input)
        return;

    const content =
        input.value.trim();

    if(!content)
        return;

    const {error} =
        await supabaseClient
        .from("posts")
        .insert({

            user_id:currentUser.id,

            content:content

        });

    if(error){

        alert(error.message);
        return;

    }

    input.value = "";

    await loadPosts();

}


/* =====================================================
   PUBLICATIONS
===================================================== */

async function loadPosts(){

    const {data,error} =
        await supabaseClient
        .from("posts")
        .select(`
            id,
            content,
            image_url,
            created_at,
            user_id,
            profiles(
                full_name,
                avatar_url
            )
        `)
        .order("created_at",{ascending:false});

    if(error){

        document.getElementById("posts")
            .innerHTML =
            `<div class="card">${escapeHTML(error.message)}</div>`;

        return;

    }

    const posts =
        document.getElementById("posts");

    if(!data.length){

        posts.innerHTML =
            `<div class="card">
                Aucune publication pour le moment.
             </div>`;

        return;

    }

    posts.innerHTML =
        data.map(post => `

        <article
            class="card"
            id="post-${post.id}"
        >

            <div class="post-header">

                <img
                    class="avatar"
                    src="${
                        post.profiles?.avatar_url ||
                        "https://i.pravatar.cc/100"
                    }"
                >

                <div>

                    <b>
                        ${escapeHTML(
                            post.profiles?.full_name ||
                            "Utilisateur"
                        )}
                    </b>

                    <small>
                        ${new Date(
                            post.created_at
                        ).toLocaleString()}
                    </small>

                </div>

            </div>

            <div class="post-content">

                ${escapeHTML(post.content)}

            </div>

            ${
                post.image_url
                ?
                `<img
                    src="${post.image_url}"
                    style="width:100%;border-radius:10px"
                >`
                :
                ""
            }

            <div
                class="post-buttons"
            >

                <button
                    onclick="likePost('${post.id}')"
                >
                    👍 J'aime
                </button>

                <button
                    onclick="commentPost('${post.id}')"
                >
                    💬 Commenter
                </button>

                <button
                    onclick="sharePost('${post.id}')"
                >
                    ↗ Partager
                </button>

            </div>

            <div id="comments-${post.id}"></div>

        </article>

        `).join("");

}


/* =====================================================
   LIKE
===================================================== */

async function likePost(postId){

    const {data} =
        await supabaseClient
        .from("likes")
        .select("id")
        .eq("post_id",postId)
        .eq("user_id",currentUser.id)
        .maybeSingle();

    if(data){

        await supabaseClient
        .from("likes")
        .delete()
        .eq("id",data.id);

    }else{

        await supabaseClient
        .from("likes")
        .insert({

            post_id:postId,

            user_id:currentUser.id

        });

    }

    alert("J'aime mis à jour.");

}


/* =====================================================
   COMMENTAIRE
===================================================== */

async function commentPost(postId){

    const content =
        prompt("Votre commentaire :");

    if(!content)
        return;

    const {error} =
        await supabaseClient
        .from("comments")
        .insert({

            post_id:postId,

            user_id:currentUser.id,

            content:content

        });

    if(error){

        alert(error.message);
        return;

    }

    alert("Commentaire ajouté.");

}


/* =====================================================
   PARTAGE
===================================================== */

async function sharePost(postId){

    const link =
        location.href +
        "#post-" +
        postId;

    try{

        await navigator.clipboard.writeText(link);

        alert("Lien copié.");

    }catch{

        prompt(
            "Copiez ce lien :",
            link
        );

    }

}


/* =====================================================
   AMIS
===================================================== */

async function showFriends(){

    if(!currentUser){

        showLogin();
        return;

    }

    const app =
        document.getElementById("app");

    const {data,error} =
        await supabaseClient
        .from("profiles")
        .select("*")
        .neq("id",currentUser.id)
        .limit(50);

    if(error){

        app.innerHTML =
            `<div class="card">${escapeHTML(error.message)}</div>`;

        return;

    }

    app.innerHTML = `

    <div class="card">

        <h2>👥 Amis</h2>

        <hr style="margin:15px 0">

        ${
            data.map(user => `

            <div class="user">

                <img
                    class="avatar"
                    src="${
                        user.avatar_url ||
                        "https://i.pravatar.cc/100"
                    }"
                >

                <div>

                    <b>
                        ${escapeHTML(user.full_name)}
                    </b>

                    <br>

                    <small>
                        @${escapeHTML(user.username)}
                    </small>

                </div>

                <button
                    class="primary"
                    onclick="sendFriendRequest('${user.id}')"
                >
                    Ajouter
                </button>

            </div>

            `).join("")
        }

    </div>

    `;

}


async function sendFriendRequest(receiverId){

    const {error} =
        await supabaseClient
        .from("friendships")
        .insert({

            requester_id:currentUser.id,

            receiver_id:receiverId

        });

    if(error){

        alert(error.message);
        return;

    }

    alert("Invitation envoyée.");

}


/* =====================================================
   MESSAGES
===================================================== */

async function showMessages(){

    if(!currentUser){

        showLogin();
        return;

    }

    const app =
        document.getElementById("app");

    app.innerHTML = `

    <div class="card">

        <h2>💬 Messages</h2>

        <hr style="margin:15px 0">

        <input
            id="receiver"
            placeholder="ID du destinataire"
            style="width:100%;padding:12px"
        >

        <br><br>

        <textarea
            id="message"
            placeholder="Écrire un message..."
            style="width:100%;height:100px;padding:12px"
        ></textarea>

        <br><br>

        <button
            class="primary"
            onclick="sendMessage()"
        >
            Envoyer
        </button>

        <hr style="margin:20px 0">

        <div id="messageList">
            Chargement...
        </div>

    </div>

    `;

    await loadMessages();

}


async function sendMessage(){

    const receiver =
        document.getElementById("receiver").value.trim();

    const content =
        document.getElementById("message").value.trim();

    if(!receiver || !content){

        alert("Remplissez tous les champs.");

        return;

    }

    const {error} =
        await supabaseClient
        .from("messages")
        .insert({

            sender_id:currentUser.id,

            receiver_id:receiver,

            content:content

        });

    if(error){

        alert(error.message);
        return;

    }

    document.getElementById("message").value="";

    await loadMessages();

}


async function loadMessages(){

    const {data,error} =
        await supabaseClient
        .from("messages")
        .select("*")
        .or(
            `sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`
        )
        .order("created_at",{ascending:true});

    if(error)
        return;

    document.getElementById("messageList")
    .innerHTML =
        data.map(m => `

        <div class="message">

            <b>
                ${
                    m.sender_id === currentUser.id
                    ?
                    "Vous"
                    :
                    "Utilisateur"
                }
            </b>

            <br>

            ${escapeHTML(m.content)}

        </div>

        `).join("");

}


/* =====================================================
   NOTIFICATIONS
===================================================== */

async function showNotifications(){

    if(!currentUser){

        showLogin();
        return;

    }

    const {data,error} =
        await supabaseClient
        .from("notifications")
        .select("*")
        .eq("user_id",currentUser.id)
        .order("created_at",{ascending:false});

    if(error){

        alert(error.message);
        return;

    }

    document.getElementById("app")
    .innerHTML = `

    <div class="card">

        <h2>🔔 Notifications</h2>

        ${
            data.length
            ?
            data.map(n=>`

                <div class="notification">

                    🔔
                    ${escapeHTML(n.content)}

                </div>

            `).join("")
            :
            "<p>Aucune notification.</p>"
        }

    </div>

    `;

}


/* =====================================================
   PROFIL
===================================================== */

async function showProfile(){

    if(!currentUser){

        showLogin();
        return;

    }

    const {data} =
        await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id",currentUser.id)
        .single();

    document.getElementById("app")
    .innerHTML = `

    <div class="card">

        <div
            style="
            height:200px;
            background:#1877f2;
            border-radius:10px;
            "
        ></div>

        <div
            style="
            margin-top:-40px;
            padding:15px;
            "
        >

            <img
                class="avatar"
                style="
                width:90px;
                height:90px;
                border:4px solid white;
                "
                src="${
                    data.avatar_url ||
                    "https://i.pravatar.cc/100"
                }"
            >

            <h2>
                ${escapeHTML(data.full_name)}
            </h2>

            <p>
                @${escapeHTML(data.username)}
            </p>

            <p>
                ${escapeHTML(data.bio || "")}
            </p>

        </div>

    </div>

    `;

}


/* =====================================================
   CONTACTS
===================================================== */

async function loadContacts(){

    const {data} =
        await supabaseClient
        .from("profiles")
        .select("*")
        .neq("id",currentUser.id)
        .limit(5);

    document.getElementById("contacts")
    .innerHTML =
        data.map(user=>`

        <div class="user">

            <img
                class="avatar"
                src="${
                    user.avatar_url ||
                    "https://i.pravatar.cc/100"
                }"
            >

            <span>
                ${escapeHTML(user.full_name)}
            </span>

        </div>

        `).join("");

}


/* =====================================================
   LOGIN
===================================================== */

function showLogin(){

    document.getElementById("app")
    .innerHTML = `

    <div
        class="card"
        style="
        max-width:500px;
        margin:auto;
        text-align:center;
        "
    >

        <h1 style="color:#1877f2">
            Connect
        </h1>

        <p>
            Votre réseau social
        </p>

        <br>

        <button
            class="primary"
            onclick="login()"
        >
            Se connecter
        </button>

        <br><br>

        <button
            class="primary"
            onclick="register()"
        >
            Créer un compte
        </button>

    </div>

    `;

}


/* =====================================================
   TEMPS RÉEL SUPABASE
===================================================== */

function startRealtime(){

    supabaseClient
    .channel("social-posts")
    .on(
        "postgres_changes",
        {
            event:"*",
            schema:"public",
            table:"posts"
        },
        ()=>{
            if(currentUser)
                loadPosts();
        }
    )
    .subscribe();


    supabaseClient
    .channel("social-messages")
    .on(
        "postgres_changes",
        {
            event:"INSERT",
            schema:"public",
            table:"messages"
        },
        payload=>{

            if(
                currentUser &&
                (
                    payload.new.sender_id === currentUser.id ||
                    payload.new.receiver_id === currentUser.id
                )
            ){

                loadMessages();

            }

        }
    )
    .subscribe();


    supabaseClient
    .channel("social-notifications")
    .on(
        "postgres_changes",
        {
            event:"INSERT",
            schema:"public",
            table:"notifications"
        },
        payload=>{

            if(
                currentUser &&
                payload.new.user_id === currentUser.id
            ){

                alert(
                    "🔔 Nouvelle notification"
                );

            }

        }
    )
    .subscribe();

}


/* =====================================================
   DÉMARRAGE
===================================================== */

async function start(){

    const {data} =
        await supabaseClient.auth.getSession();

    if(data.session){

        currentUser =
            data.session.user;

        await loadProfile();

        showHome();

        startRealtime();

    }else{

        showLogin();

    }

}

start();

</script>

</body>
  </html>
